<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MoshPin</title>
<meta name="theme-color" content="#1c1d1c">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body class="gridpage">
<div id="app" hidden>

  <header class="topbar">
    <div class="tb1">
      <a class="brandmark" href="grid.html"><img src="logo.png" alt=""><b>Mosh<span>Pin</span></b></a>
      <div class="evname"><b id="evTitle"></b><span id="evSub"></span></div>
      <button class="iconbtn" id="crewBtn">👥<span class="n" id="crewN">0</span></button>
      <button class="iconbtn" id="menuBtn">☰</button>
    </div>
    <nav class="tb2" id="dayTabs"></nav>
  </header>

  <div class="tt">
    <div class="ttop">
      <div class="tcorner"></div>
      <div class="theadwrap" id="gHeadWrap"><div class="thead" id="gHead"></div></div>
    </div>
    <div class="tbody">
      <div class="tcol" id="gTime"></div>
      <div class="twrap" id="gWrap"><div class="tgrid" id="gGrid"></div></div>
    </div>
  </div>
</div>

<div class="dock" id="dock" hidden>
  <div class="dockpanel" id="ciPanel">
    <div class="chead2" id="ciHead"></div>
    <div class="cibody" id="ciBody"></div>
    <div class="cifoot" id="ciFoot"></div>
  </div>

  <div class="dockpanel" id="chPanel">
    <div class="chead2"><b>💬 Chat</b><button class="btn sm" id="chX" style="margin-left:auto">✕</button></div>
    <div class="chatlog" id="chLog"></div>
    <div class="emojipanel" id="chEmoji"></div>
    <div class="chatbar">
      <button class="btn sm" id="chEmojiBtn">🙂</button>
      <input type="text" id="chInput" maxlength="300" placeholder="Say something…">
      <button class="btn primary sm" id="chSend">Send</button>
    </div>
  </div>

  <div class="fabs">
    <button class="fab" id="ciFab">📍<span class="cnt" id="ciCount"></span></button>
    <button class="fab" id="chFab">💬<span class="cnt warn" id="chCount"></span></button>
  </div>
</div>

<div class="rxpick" id="rxPick"></div>

<div class="sheet" id="menuSheet"><div class="panel" id="menuBody"></div></div>
<div class="sheet" id="crewSheet"><div class="panel" id="crewBody"></div></div>
<div class="sheet" id="trSheet"><div class="panel" id="trBody"></div></div>
<div class="sheet" id="boardSheet"><div class="panel" id="boardBody"></div></div>
<div class="sheet" id="wrapSheet"><div class="panel" id="wrapBody"></div></div>
<div class="sheet" id="actSheet"><div class="panel" id="actBody"></div></div>
<div class="sheet" id="mineSheet"><div class="panel" id="mineBody"></div></div>
<div class="sheet" id="profSheet"><div class="panel" id="profBody"></div></div>

<script type="module" src="grid.js"></script>
</body>
</html>
