<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timetable — MoshPin</title>
<meta name="theme-color" content="#1c1d1c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body class="gridpage">
<div id="app" hidden>

  <header class="ghead">
    <a class="btn sm" href="app.html">‹ Crew</a>
    <div class="gtitle" id="festName"></div>
    <button class="btn sm" id="boardBtn" hidden>🏆</button>
    <button class="btn sm" id="wrapBtn" hidden>🎁</button>
    <button class="btn sm" id="mineBtn"><span id="picked">0 tagged</span></button>
  </header>

  <nav class="tabs" id="dayTabs"></nav>

  <div class="tt">
    <div class="ttop">
      <div class="tcorner"></div>
      <div class="theadwrap" id="gHeadWrap"><div class="thead" id="gHead"></div></div>
    </div>
    <div class="tbody">
      <div class="tcol" id="gTime"></div>
      <div class="twrap" id="gWrap"><div class="tgrid" id="gGrid"></div></div>
    </div>
  </div>
</div>

<div class="dock" id="dock" hidden>
  <div class="dockpanel" id="ciPanel">
    <div class="chead2" id="ciHead"></div>
    <div class="cibody" id="ciBody"></div>
    <div class="cifoot" id="ciFoot"></div>
  </div>
  <div class="dockpanel" id="chPanel">
    <div class="chead2"><b>💬 Chat</b><button class="btn sm" id="chX" style="margin-left:auto">✕</button></div>
    <div class="chatlog" id="chLog"></div>
    <div class="emojipanel" id="chEmoji"></div>
    <div class="chatbar">
      <button class="btn sm" id="chEmojiBtn">🙂</button>
      <input type="text" id="chInput" maxlength="300" placeholder="Say something…">
      <button class="btn primary sm" id="chSend">Send</button>
    </div>
  </div>

  <div class="fabs">
    <button class="fab" id="ciFab">📍<span class="cnt" id="ciCount"></span></button>
    <button class="fab" id="chFab">💬<span class="cnt warn" id="chCount"></span></button>
  </div>
</div>

<div class="rxpick" id="rxPick"></div>

<div class="sheet" id="boardSheet"><div class="panel" id="boardBody"></div></div>
<div class="sheet" id="wrapSheet"><div class="panel" id="wrapBody"></div></div>

<div class="sheet" id="actSheet"><div class="panel" id="actBody"></div></div>
<div class="sheet" id="mineSheet"><div class="panel" id="mineBody"></div></div>

<script type="module" src="grid.js"></script>
</body>
</html>
