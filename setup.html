<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festival setup — MoshPin</title>
<meta name="theme-color" content="#1c1d1c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap" id="app" hidden>

  <header class="chead">
    <div>
      <div class="ctitle" id="festTitle">Festival</div>
      <div class="hint" id="counts"></div>
    </div>
    <a class="btn sm" href="app.html">Done</a>
  </header>

  <div class="err on" id="problems" hidden></div>

  <div class="card">
    <h2>Days</h2>
    <p class="hint">A day can run past midnight — set how many hours it lasts and
      late sets land in the right place.</p>
    <div class="tabs" id="dayTabs"></div>

    <div id="dayPanel" hidden>
      <label for="dayDate">Date</label>
      <input type="date" id="dayDate">
      <div class="row">
        <div>
          <label for="dayStart">Starts at (hour)</label>
          <input type="number" id="dayStart" min="0" max="23">
        </div>
        <div>
          <label for="dayHours">Lasts (hours)</label>
          <input type="number" id="dayHours" min="1" max="24">
        </div>
      </div>
      <p class="hint" id="dayEnds" style="margin-top:8px"></p>
      <button class="btn sm danger" id="delDay" style="margin-top:12px">Delete this day</button>
    </div>
  </div>

  <div class="card">
    <h2>Venues</h2>
    <div id="venueList" class="mlist"></div>
    <div class="row" style="margin-top:14px">
      <input type="text" id="venueName" placeholder="e.g. The Loop, or Food court" maxlength="40">
      <select id="venueType" style="flex:0 0 120px">
        <option value="stage">Stage</option>
        <option value="spot">Spot</option>
      </select>
    </div>
    <button class="btn wide" id="addVenue" style="margin-top:10px">Add venue</button>
  </div>

  <div class="card">
    <h2>Sets</h2>
    <p class="hint" id="actHelp" hidden></p>
    <div id="actForm" hidden>
      <label for="actName">Who's playing</label>
      <input type="text" id="actName" maxlength="60" placeholder="Artist or b2b">
      <div class="row">
        <div>
          <label for="actStart">From</label>
          <input type="text" id="actStart" placeholder="22:00" maxlength="5" inputmode="numeric">
        </div>
        <div>
          <label for="actEnd">Until</label>
          <input type="text" id="actEnd" placeholder="23:30" maxlength="5" inputmode="numeric">
        </div>
      </div>
      <label for="actVenue">Stage</label>
      <select id="actVenue"></select>
      <label for="actUrl">Link (optional)</label>
      <input type="text" id="actUrl" placeholder="SoundCloud, YouTube…">
      <button class="btn wide" id="addAct" style="margin-top:12px">Add set</button>
    </div>
    <div id="actList" class="mlist" style="margin-top:16px"></div>
  </div>

  <button class="btn primary wide lg" id="saveBtn" style="margin:6px 0 30px">Save changes</button>
</div>

<script type="module" src="setup.js"></script>
</body>
</html>
